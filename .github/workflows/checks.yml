name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-checks.txt
      - run: python -m unittest discover -s tests
      - run: python main.py --help
      - run: python -m scripts.prepare_data --input examples/posts.csv --output /tmp/style-data --min-chars 20
